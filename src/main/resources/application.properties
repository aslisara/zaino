spring.application.name=exploreworld

spring.datasource.url=jdbc:postgresql://localhost:5433/exploreworld
spring.datasource.username=exploreworld
spring.datasource.password=exploreworld

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

management.endpoints.web.exposure.include=health,info
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-32-bytes-minimum!!}
anthropic.api-key=${ANTHROPIC_API_KEY:}
anthropic.model=claude-sonnet-5-5
anthropic.max-tokens=3000
server.port=${PORT:8080}
server.forward-headers-strategy=framework
